services:
  db:
    image: postgres:16
    env_file:
      - .env.docker
    # хранилище для БД, чтобы БД каждый раз не пересоздавалась
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 3s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    env_file:
      - .env.docker
    healthcheck:
      test: redis-cli ping
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build: .
    command: bash -c "python manage.py migrate && python manage.py collectstatic -c --no-input && python manage.py runserver 0.0.0.0:8000"

    env_file: .env.docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8000"
    volumes:
      - django_static:/app/staticfiles/

  web:
    image: nginx:1.19.3
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - django_static:/usr/share/nginx/html/static/

  celery:
    build:
      context: .
    container_name: celery_worker
    command:
      celery -A config worker -l INFO
    env_file:
      - ./.env.docker
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  celery_beat:
    build:
      context: .
    container_name: celery_beat
    command:
      celery -A config beat --loglevel=INFO
    env_file:
      - ./.env.docker
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - celery

volumes:
  postgres_data:
  django_static:
