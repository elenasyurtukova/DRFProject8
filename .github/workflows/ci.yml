name: Django CI/CD

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: flake8 .

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-root

      - name: Run tests and coverage tests
        run: |
          python manage.py test
          poetry run coverage run --source='.' manage.py test
          poetry run coverage report
        env:
          SECRET_KEY: test_secret_key

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Create .env.docker file
        run: |
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env.docker
          echo "DEBUG=${{ secrets.DEBUG }}" >> .env.docker

          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env.docker
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env.docker
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env.docker
          echo "POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}" >> .env.docker
          echo "POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}" >> .env.docker

          echo "CELERY_BROKER_URL=${{ secrets.CELERY_BROKER_URL }}" >> .env.docker
          echo "CELERY_RESULT_BACKEND=${{ secrets.CELERY_RESULT_BACKEND }}" >> .env.docker

      - name: Log in to Docker Hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build and push Docker images
        run: |
          docker compose build ${{ secrets.DOCKER_HUB_USERNAME }}/DRFProject8:${{ github.sha }}
          docker compose push

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << EOF
          sudo docker-compose pull ${{ secrets.DOCKER_HUB_USERNAME }}/DRFProject8:${{ github.sha }}
          sudo docker-compose down --remove-orphans || true
          sudo docker-compose up -d --force-recreate
          EOF